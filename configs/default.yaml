# Probe model settings. Override on the command line with --probe and --model.
probes:
  openai:
    model: gpt-4o-2024-11-20
    base_url: null          # set for OpenAI-compatible endpoints (vLLM, etc.)
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 512
  qwen:
    model: Qwen/Qwen2.5-VL-7B-Instruct
    device: cuda
    temperature: 0.0
    max_tokens: 512
  mock:
    # deterministic fake probe for dry runs; see probes/mock.py
    seed: 0
    blind_accuracy: 0.6
    observed_accuracy: 0.85

experiment:
  max_k: 5                # longest blind horizon to probe
  history_window: 10      # how many past actions (text only) to include
  image_max_side: 1024    # downscale screenshots before sending
  n_samples: 3            # Stage 2 samples per condition
  sample_temperature: 0.7 # Stage 2 sampling temperature
  strict_match: false     # bbox-level match instead of type-level
