[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_plan"
version = "0.1.0"
description = "Motivation experiments for adaptive planning in GUI agents"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
qwen = ["torch", "transformers>=4.45", "qwen-vl-utils"]
tfrecord = ["tensorflow"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
